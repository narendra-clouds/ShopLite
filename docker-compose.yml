services:

  frontend:
    build:
      context: ./frontend
    container_name: shoplite-frontend
    ports:
      - "5173:5173"
    depends_on:
      - gateway

  gateway:
    build:
      context: ./gateway
    container_name: shoplite-gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      REVIEW_SERVICE_URL: http://review-service:3005
    depends_on:
      - user-service
      - product-service
      - order-service
      - notification-service
      - review-service

  user-service:
    build:
      context: ./services/user-service
    container_name: shoplite-user-service
    expose:
      - "3001"

  product-service:
    build:
      context: ./services/product-service
    container_name: shoplite-product-service
    expose:
      - "3002"
    environment:
      USER_SERVICE_URL: http://user-service:3001
      INTERNAL_SERVICE_KEY: shoplite-internal-dev-key
    depends_on:
      - user-service

  order-service:
    build:
      context: ./services/order-service
    container_name: shoplite-order-service
    expose:
      - "3003"
    environment:
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      INTERNAL_SERVICE_KEY: shoplite-internal-dev-key
    depends_on:
      - user-service
      - product-service
      - notification-service

  notification-service:
    build:
      context: ./services/notification-service
    container_name: shoplite-notification-service
    expose:
      - "3004"

  review-service:
    build:
      context: ./services/review-service
    container_name: shoplite-review-service
    expose:
      - "3005"
    environment:
      USER_SERVICE_URL: http://user-service:3001
    depends_on:
      - user-service